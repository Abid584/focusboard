services:
  db:
    image: postgres:17
    container_name: focusboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: focusboard
    ports:
      - "5432:5432"
    volumes:
      - focusboard-data:/var/lib/postgresql/data

volumes:
  focusboard-data:
